default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

# One job at a time, so a demo data seed and an employee import never hold their memory at once.
production:
  <<: *default
  workers:
    - queues: "*"
      threads: 1
      polling_interval: 1
