# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  cache:
    <<: *default
    database: storage/development_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Production runs on Neon Postgres. All four databases live on the same Neon branch, so each URL is
# DATABASE_URL with the database name swapped. DATABASE_URL is Neon's pooled (PgBouncer) endpoint;
# schema changes need the direct endpoint, so bin/docker-entrypoint runs db:prepare with
# DATABASE_URL set to DATABASE_URL_UNPOOLED.
<%
  neon_url = lambda do |database|
    url = ENV["DATABASE_URL"]
    next if url.nil? || url.empty?

    URI(url).tap { |uri| uri.path = "/#{database}" }.to_s
  end
%>
postgres: &postgres
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

production:
  primary:
    <<: *postgres
    url: <%= neon_url.("production") %>
  cache:
    <<: *postgres
    url: <%= neon_url.("production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *postgres
    url: <%= neon_url.("production_queue") %>
    # Solid Queue runs inside Puma (config/puma.rb), so its dispatcher, worker, scheduler, and
    # heartbeat threads share this pool with Puma's request threads enqueueing jobs.
    max_connections: 10
    migrations_paths: db/queue_migrate
  cable:
    <<: *postgres
    url: <%= neon_url.("production_cable") %>
    migrations_paths: db/cable_migrate
